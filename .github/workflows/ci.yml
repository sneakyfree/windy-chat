name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  WINDY_JWT_SECRET: ci-test-secret
  CHAT_API_TOKEN: ci-test-token
  CHAT_SERVICE_TOKEN: ci-test-service-token
  ETERNITAS_WEBHOOK_SECRET: ci-test-eternitas-secret

jobs:
  test-unit:
    name: Unit Tests (${{ matrix.service }})
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        # agent-roster added 2026-07-26: it had 14 test files and 90 tests
        # that CI had never once executed, because the service shipped
        # without a `test` script and this matrix keys off `npm test`.
        service: [onboarding, directory, push-gateway, backup, social, media, call-history, translation, agent-roster]
    steps:
      - uses: actions/checkout@v4
      - name: runner-lint (hosted runners are billing-locked)
        run: bash "$GITHUB_WORKSPACE/.github/lint/lint-runner-labels.sh" "$GITHUB_WORKSPACE/.github/workflows"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared deps
        run: cd services/shared && npm ci
      - name: Install ${{ matrix.service }} deps
        run: cd services/${{ matrix.service }} && npm ci
      - name: Test ${{ matrix.service }}
        run: cd services/${{ matrix.service }} && npm test

  test-unit-new:
    name: Unit Tests (${{ matrix.test }})
    runs-on: [self-hosted, linux, x64]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: social-new
            file: tests/unit/test-social-new.js
            deps: social
          - test: onboarding-new
            file: tests/unit/test-onboarding-new.js
            deps: onboarding
          - test: shared
            file: tests/unit/test-shared.js
            deps: social
          - test: new-features
            file: tests/unit/test-new-features.js
            deps: social
          - test: eternitas-webhook
            file: tests/unit/test-eternitas-webhook.js
            deps: social
          - test: agent-provision
            file: tests/unit/test-agent-provision.js
            deps: onboarding
          - test: hatch-passport-check
            file: tests/unit/test-hatch-passport-check.js
            deps: onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install shared deps
        run: cd services/shared && npm ci
      - name: Install deps
        run: |
          cd services/${{ matrix.deps }} && npm ci
          cd ../directory && npm ci 2>/dev/null || true
      - name: Test ${{ matrix.test }}
        run: node --test --experimental-test-isolation=none --test-force-exit ${{ matrix.file }}

  test-integration:
    name: Integration Tests
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install all deps
        run: |
          cd services/shared && npm ci && cd ..
          for svc in onboarding directory push-gateway backup social translation media call-history; do
            cd $svc && npm ci && cd ..
          done
      - name: Run stress test (all 8 services)
        run: node --test --experimental-test-isolation=none --test-force-exit tests/stress/test_full_mesh.js
      - name: Run full stack integration test
        run: node --test --experimental-test-isolation=none --test-force-exit tests/integration/test_full_stack.js
      - name: Run agent onboarding integration test
        run: node --test --experimental-test-isolation=none --test-force-exit tests/integration/test_agent_onboarding.js
      - name: Run unified login integration test
        run: node --test --experimental-test-isolation=none --test-force-exit tests/integration/test_unified_login.js

  test-suites:
    name: Service + Contract Suites
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install all deps
        run: |
          cd services/shared && npm ci && cd ..
          for svc in onboarding directory push-gateway backup social translation media call-history; do
            cd $svc && npm ci && cd ..
          done
      # GLOBS, not a file list. 13 suites (~215 tests) sat at the repo root
      # and under tests/integration/ that CI had NEVER run — each service's
      # Jest is rooted inside services/<name>/ so it cannot see them, and
      # nothing else referenced them. They rotted: three asserted contracts
      # that had since been deliberately tightened, and one was hiding a real
      # retention bug. Globbing means a new file here is covered the day it
      # lands instead of going quietly unrun.
      - name: Root service suites
        run: |
          for f in tests/*.test.js; do
            echo "Running $f..."
            node --test --experimental-test-isolation=none --test-force-exit "$f"
          done
      - name: Integration + contract suites
        run: |
          for f in tests/integration/*.js; do
            echo "Running $f..."
            node --test --experimental-test-isolation=none --test-force-exit "$f"
          done

  test-hardening:
    name: Hardening Tests
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install all deps
        run: |
          cd services/shared && npm ci && cd ..
          for svc in onboarding directory push-gateway backup social translation media call-history; do
            cd $svc && npm ci && cd ..
          done
      - name: Run hardening tests
        run: |
          for f in tests/hardening/*.js; do
            echo "Running $f..."
            node --test --experimental-test-isolation=none --test-force-exit "$f"
          done

  lint:
    name: Lint + Syntax Check
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: no process.exit() in tests (corrupts the node:test IPC channel)
        run: bash "$GITHUB_WORKSPACE/.github/lint/lint-no-test-process-exit.sh" "$GITHUB_WORKSPACE/tests"
      - name: Check for syntax errors (all .js files)
        run: |
          for f in $(find services -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f" || exit 1
          done

  build-web:
    name: Build Web App
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: cd web && npm ci
      - name: TypeScript check
        run: cd web && npx tsc --noEmit
      - name: Build
        run: cd web && npm run build
      - name: Verify dist output
        run: |
          test -f web/dist/index.html || (echo "Missing dist/index.html" && exit 1)
          echo "Web app built successfully ($(du -sh web/dist | cut -f1))"

  docker-build:
    name: Docker Build
    runs-on: [self-hosted, linux, x64]
    needs: [lint, build-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          for svc in onboarding directory push-gateway backup social translation media call-history; do
            echo "Building $svc..."
            docker build --build-arg SERVICE_DIR=$svc -t windy-$svc:ci services/
          done
      - name: Build web image
        run: docker build -t windy-web:ci web/
      - name: Verify images exist
        run: |
          for svc in onboarding directory push-gateway backup social translation media call-history web; do
            docker image inspect windy-$svc:ci > /dev/null 2>&1 || (echo "Missing image: windy-$svc" && exit 1)
          done
          echo "All 9 images built successfully"
